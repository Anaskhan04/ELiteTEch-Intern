<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Temperature calculator</h1>
        <div id="container">
        <label class="label1">Enter Value:</label>
          <input id="Temperature" type="text" placeholder="Enter number" >
          <label  class="label1" >Select unit:</label>
          <select id="unit1" >
            <option value="Fahrenheit" >Fahrenheit</option>
            <option value="celsius">Celsius</option>
          </select>
          <label class="result" >Result:</label>
          <button id="button" onclick="convert()">Convert</button>
          <div id="result" ></div>
        </div>
    <script src="script.js"></script>
</body>
</html>
